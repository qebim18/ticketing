<div style="padding: 20px; max-width: 500px;">
  <h3>Registrar Usuario</h3>
  <form (ngSubmit)="guardar()" style="display: flex; flex-direction: column; gap: 15px;">

    <mat-form-field appearance="outline">
      <mat-label>Nombres</mat-label>
      <input matInput [(ngModel)]="usuarioData.nombres" name="nombres" required>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Apellidos</mat-label>
      <input matInput [(ngModel)]="usuarioData.apellidos" name="apellidos" required>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" [(ngModel)]="usuarioData.email" name="email" required>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit">Guardar</button>
  </form>
</div>
