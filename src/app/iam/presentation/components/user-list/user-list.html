<div style="padding: 20px;">
  <h2>Gestión de Usuarios</h2>
  <button mat-raised-button color="primary" style="margin-bottom: 15px;">+ Nuevo Usuario</button>

  <!-- Cambio clave: dataSource recibe la Signal usuarios() -->
  <table mat-table [dataSource]="usuarios()" class="mat-elevation-z2" style="width: 100%;">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let u"> {{u.id_usuario}} </td>
    </ng-container>

    <ng-container matColumnDef="nombres">
      <th mat-header-cell *matHeaderCellDef> Nombres </th>
      <td mat-cell *matCellDef="let u"> {{u.nombres}} {{u.apellidos}} </td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef> Email </th>
      <td mat-cell *matCellDef="let u"> {{u.email}} </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let u">
        <button mat-icon-button color="accent"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" (click)="eliminar(u.id_usuario)"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
  </table>
</div>
